# 웹소켓은 로그인 토큰을 주소(?token=...)로 받는다. 기본 로그 형식은 쿼리까지 찍어서
# 토큰이 로그에 그대로 남았다 — 웹소켓 경로만 쿼리를 뺀 형식($uri)으로 남긴다.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    root /usr/share/nginx/html;

    # 무중단 배포: 백엔드가 2개(backend, backend-b)이고 배포 때 하나씩 다시 뜬다.
    # 'backend' 를 시작할 때 한 번만 찾으면 다시 뜬 컨테이너의 새 IP 를 모른다 —
    # 도커 DNS 에 2초마다 다시 묻고, 그 이름으로 나오는 주소들 중 붙는 쪽으로 보낸다.
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $backend_upstream http://backend:8000;
    # 꺼지는 백엔드에 막 들어간 요청은 읽히기 전에 연결이 끊긴다. 기본값은 POST 를 다시 안 보내서
    # 배포 중 POST 가 502 로 떨어졌다(실측 7천 건 중 3건). 접속 '에러'일 때만 POST 도 다른 백엔드로 —
    # 백엔드는 종료 신호를 받으면 처리 중인 요청은 끝내고 나가므로 이 경우는 처리 전이다.
    # 'timeout'(응답 대기 초과)은 넣지 않는다: 오래 걸리는 작업이 두 번 실행되면 안 된다.
    proxy_next_upstream error non_idempotent;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 3s;

    index index.html;
    client_max_body_size 2G;

    # gzip — 베이스 nginx:1.25-alpine 이미지의 기본값이 off라(nginx.conf에 #gzip on
    # 주석 처리) 지금까지 JS 번들(1MB+)·API JSON 응답이 전부 무압축으로 나가고
    # 있었음. text 계열만 대상(이미지/폰트는 이미 압축 포맷이라 의미 없음).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # 클라이언트 → nginx 바디 전송 타임아웃 완화 (모바일 업로드 중 잠깐 멈춰도 유지)
    client_body_timeout   600s;
    send_timeout          600s;

    # univpt33 도메인 폐기 — 단일 도메인(univpt)으로 영구 리다이렉트
    if ($host = "univpt33.yhkkkkhy.my") {
        return 301 https://univpt.yhkkkkhy.my$request_uri;
    }

    # /.well-known/* 는 기계가 읽는 검증 파일 자리다. SPA 폴백에 걸리면 JSON 을
    # 기대한 쪽에 index.html 이 가서, 검증이 '실패'가 아니라 '이상한 응답'으로 끝난다.
    # 파일이 있으면 주고 없으면 404 를 준다.
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # iOS 는 HTML 의 <link rel="apple-touch-icon"> 을 안 읽는 경로(링크 미리보기·즐겨찾기 등)에서
    # 루트의 고정 이름 /apple-touch-icon[-120x120][-precomposed].png 을 찾는다. 같은 아이콘을 준다.
    # 아래 정적 자산 정규식(.png)보다 먼저 와야 한다 — 정규식 location 은 적힌 순서로 맞춘다.
    location ~ ^/apple-touch-icon(-\d+x\d+)?(-precomposed)?\.png$ {
        rewrite ^ /icons/apple-touch-icon.png last;
    }

    # React SPA 라우팅 — HTML은 절대 캐시 금지
    # (번들은 hash-named라 캐시 OK, but index.html이 캐시되면 옛 번들 계속 참조)
    location / {
        # 크롤러면 제목이 박힌 미리보기 페이지로. 사람은 그대로 SPA.
        if ($preview_bot) {
            rewrite ^ /go/__preview?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/security-headers.conf;
        expires off;
    }

    # Service Worker — 캐시 금지 + Service-Worker-Allowed 헤더
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/security-headers.conf;
        expires off;
    }

    # 영상 직접 업로드 — 스트리밍(버퍼링 OFF) + 긴 타임아웃
    # 대용량 + 동시 업로드 대비: nginx가 전체 바디를 버퍼링하지 않고 바로 백엔드로 스트리밍
    location ~ ^/api/v1/sessions/[0-9]+/videos/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_request_buffering off;   # 클라 → 백엔드 스트리밍
        proxy_buffering         off;   # 백엔드 → 클라 스트리밍
        proxy_cache             off;

        proxy_read_timeout     1800s;  # 30분 — 느린 모바일 업로드 대비
        proxy_send_timeout     1800s;
        proxy_connect_timeout  10s;
    }

    # 실시간 피드백 WebSocket — Upgrade 헤더 필수 (긴 연결 유지)
    location /api/v1/live-feedback/ws/ {
        access_log /var/log/nginx/access.log noquery;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;   # WS 유휴 유지 (하트비트 30s)
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
    }

    # 오프·오피 투표 실시간 신호 WebSocket — 기수 포털이 떠 있는 동안 1개 유지
    location = /api/v1/session-votes/ws {
        access_log /var/log/nginx/access.log noquery;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
    }

    # 심사 결과 실시간 갱신 WebSocket — Upgrade 헤더 필수
    # 주의: 아래 location /api/ 에는 Upgrade 헤더가 없어서, 이 블록이 없으면 WS가 붙지 않는다.
    location /api/v1/scoring/ws/ {
        access_log /var/log/nginx/access.log noquery;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;   # WS 유휴 유지 (하트비트 30s)
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
    }

    # API 프록시 → backend (Tier2)
    # 공유 링크 랜딩. SPA 로 넘기면 카카오톡 크롤러가 JS 를 안 돌려서 미리보기가
    # 전부 "UnivPT Ops" 하나로 뜬다. 백엔드가 Open Graph 태그를 직접 내려준다.
    # ^~ 가 필요하다. nginx 는 정규식 location 을 prefix location 보다 먼저 맞춰보는데,
    # 아래 정적파일 블록(~* \.(js|css|...)$)이 /go/redirect.js 를 가로채 404 를 냈다.
    # ^~ 를 붙이면 이 prefix 가 맞은 시점에 정규식 검사를 중단한다.
    location ^~ /go/ {
        # 인증 없이 닿는 경로 — 상한을 둔다(burst 까지는 그냥 통과시킨다)
        limit_req zone=api_rl burst=1000 nodelay;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 요청마다 접속기록 1줄 + DB 세션 1개가 생긴다. 상한이 없으면 로그인 없이도
        # 디스크를 채울 수 있다. 30명이 쓰는 서비스라 이 값은 체감되지 않는다.
        limit_req zone=api_rl burst=1000 nodelay;
        limit_conn api_conn 200;
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 크롤러 장시간 실행 대비 (영상 업로드 최대 10분)
        proxy_read_timeout    600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;

        # SSE / 실시간 폴링 대비
        proxy_buffering    off;
        proxy_cache        off;
    }

    # 정적 자산 캐시
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # 보안 헤더
    # add_header 가 없는 location(예: /api/)은 여기서 물려받는다.
    # add_header 를 가진 location 은 상속이 끊기므로 각자 include 한다.
    include /etc/nginx/security-headers.conf;
}
