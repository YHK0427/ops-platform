server {
    listen 80;
    root /usr/share/nginx/html;

    index index.html;
    client_max_body_size 2G;

    # gzip — 베이스 nginx:1.25-alpine 이미지의 기본값이 off라(nginx.conf에 #gzip on
    # 주석 처리) 지금까지 JS 번들(1MB+)·API JSON 응답이 전부 무압축으로 나가고
    # 있었음. text 계열만 대상(이미지/폰트는 이미 압축 포맷이라 의미 없음).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # 클라이언트 → nginx 바디 전송 타임아웃 완화 (모바일 업로드 중 잠깐 멈춰도 유지)
    client_body_timeout   600s;
    send_timeout          600s;

    # univpt33 도메인 폐기 — 단일 도메인(univpt)으로 영구 리다이렉트
    if ($host = "univpt33.yhkkkkhy.my") {
        return 301 https://univpt.yhkkkkhy.my$request_uri;
    }

    # /.well-known/* 는 기계가 읽는 검증 파일 자리다. SPA 폴백에 걸리면 JSON 을
    # 기대한 쪽에 index.html 이 가서, 검증이 '실패'가 아니라 '이상한 응답'으로 끝난다.
    # 파일이 있으면 주고 없으면 404 를 준다.
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # React SPA 라우팅 — HTML은 절대 캐시 금지
    # (번들은 hash-named라 캐시 OK, but index.html이 캐시되면 옛 번들 계속 참조)
    location / {
        # 크롤러면 제목이 박힌 미리보기 페이지로. 사람은 그대로 SPA.
        if ($preview_bot) {
            rewrite ^ /go/__preview?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/security-headers.conf;
        expires off;
    }

    # Service Worker — 캐시 금지 + Service-Worker-Allowed 헤더
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/security-headers.conf;
        expires off;
    }

    # 영상 직접 업로드 — 스트리밍(버퍼링 OFF) + 긴 타임아웃
    # 대용량 + 동시 업로드 대비: nginx가 전체 바디를 버퍼링하지 않고 바로 백엔드로 스트리밍
    location ~ ^/api/v1/sessions/[0-9]+/videos/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_request_buffering off;   # 클라 → 백엔드 스트리밍
        proxy_buffering         off;   # 백엔드 → 클라 스트리밍
        proxy_cache             off;

        proxy_read_timeout     1800s;  # 30분 — 느린 모바일 업로드 대비
        proxy_send_timeout     1800s;
        proxy_connect_timeout  10s;
    }

    # 실시간 피드백 WebSocket — Upgrade 헤더 필수 (긴 연결 유지)
    location /api/v1/live-feedback/ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;   # WS 유휴 유지 (하트비트 30s)
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
    }

    # 심사 결과 실시간 갱신 WebSocket — Upgrade 헤더 필수
    # 주의: 아래 location /api/ 에는 Upgrade 헤더가 없어서, 이 블록이 없으면 WS가 붙지 않는다.
    location /api/v1/scoring/ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;   # WS 유휴 유지 (하트비트 30s)
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
    }

    # API 프록시 → backend (Tier2)
    # 공유 링크 랜딩. SPA 로 넘기면 카카오톡 크롤러가 JS 를 안 돌려서 미리보기가
    # 전부 "UnivPT Ops" 하나로 뜬다. 백엔드가 Open Graph 태그를 직접 내려준다.
    # ^~ 가 필요하다. nginx 는 정규식 location 을 prefix location 보다 먼저 맞춰보는데,
    # 아래 정적파일 블록(~* \.(js|css|...)$)이 /go/redirect.js 를 가로채 404 를 냈다.
    # ^~ 를 붙이면 이 prefix 가 맞은 시점에 정규식 검사를 중단한다.
    location ^~ /go/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 크롤러 장시간 실행 대비 (영상 업로드 최대 10분)
        proxy_read_timeout    600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;

        # SSE / 실시간 폴링 대비
        proxy_buffering    off;
        proxy_cache        off;
    }

    # 정적 자산 캐시
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # 보안 헤더
    # add_header 가 없는 location(예: /api/)은 여기서 물려받는다.
    # add_header 를 가진 location 은 상속이 끊기므로 각자 include 한다.
    include /etc/nginx/security-headers.conf;
}
