# 보안 헤더 모음.
#
# nginx 의 add_header 는 상속 규칙이 함정이다 — 하위 location 에 add_header 가
# **하나라도** 있으면 상위 레벨의 add_header 를 전부 물려받지 않는다.
# 그래서 Cache-Control 을 붙여둔 location / 과 정적 파일 블록에서는 CSP·X-Frame-Options
# 같은 보안 헤더가 통째로 사라지고 있었다(HTML 문서에 정작 가장 필요한 곳이다).
#
# 해결: 이 파일을 add_header 가 있는 모든 location 에 include 한다.
# 새 location 에 add_header 를 넣을 때는 이 파일도 같이 include 해야 한다.
add_header X-Frame-Options            "DENY"        always;
add_header X-Content-Type-Options     "nosniff"     always;
add_header Referrer-Policy            "same-origin" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://*.r2.cloudflarestorage.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'" always;
add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
# 내부 동아리 도구라 검색에 뜰 이유가 없다. robots.txt 는 '요청'일 뿐이라 헤더로 못박는다.
add_header X-Robots-Tag               "noindex, nofollow, noarchive" always;
