# 미리보기 크롤러 판별.
#
# 카카오톡·슬랙 등은 자바스크립트를 실행하지 않아서, SPA 를 그대로 주면 공유
# 미리보기가 전부 "UnivPT Ops" 하나로 뜬다. 이 크롤러들만 백엔드의 미리보기
# 페이지로 보내고, 사람은 평소대로 SPA 를 받는다.
# (검색엔진은 넣지 않는다 — 색인될 생각이 없다.)
#
# map 은 http 레벨 지시어라 server 블록 안에 둘 수 없다. conf.d/*.conf 는
# nginx.conf 의 http 블록에서 include 되므로 이렇게 별도 파일로 둔다.
map $http_user_agent $preview_bot {
    default                      0;
    "~*kakaotalk"                1;
    "~*kakaostory"               1;
    "~*facebookexternalhit"      1;
    "~*facebookcatalog"          1;
    "~*Twitterbot"               1;
    "~*Slackbot"                 1;
    "~*Discordbot"               1;
    "~*TelegramBot"              1;
    "~*WhatsApp"                 1;
    "~*LINE-ApacheHttpClient"    1;
    "~*SkypeUriPreview"          1;
    "~*Iframely"                 1;
    "~*Embedly"                  1;
}


# 레이트 리밋 존.
#
# 인증 없이 닿는 경로(/go/, 공개 채점 폼)와 API 전반에 상한을 둔다. 지금은 아무
# 제한이 없어서, 로그인 없이도 요청 하나마다 접속기록 한 줄이 쌓이고 DB 세션이
# 하나씩 열린다. 임의 경로로 반복하면 디스크가 찬다 — pg_data 가 영상·백업과
# 같은 디스크라 DB 까지 같이 넘어간다.
#
# 터널(cloudflared) 뒤라 연결 주소는 전부 도커 게이트웨이(172.x) 하나다. 그대로 쓰면
# 제한이 "사람별"이 아니라 "전체 합산"으로 걸려, 세션 시작 때 수십 명이 동시에 열면
# 서로를 막는다. 도커 내부에서 온 연결(= 터널)일 때만 Cloudflare 가 붙인
# CF-Connecting-IP 를 실제 주소로 쓴다. 이 헤더는 Cloudflare 가 매번 덮어써서
# 사용자가 위조할 수 없고, nginx 는 127.0.0.1 에만 열려 있어 터널 말고는 닿지 않는다.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# 같은 강의실 WiFi(공인 IP 하나)에서 30명 넘게 동시에 포털을 열거나 실시간 피드백을
# 보내도 안 걸리게 넉넉히 잡는다. 목적은 스크립트성 폭주 차단이지 사람 제한이 아니다.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=50r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_conn_status 429;
